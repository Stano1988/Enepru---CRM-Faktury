{% extends 'base.html' %}{% block content %}<h1>Zkontrolovat a odeslat e-mail</h1><section class="panel narrow">{% if msg.invoice_id %}<p>Příloha: <a href="{% url 'invoice_pdf' msg.invoice_id %}" target="_blank" rel="noopener">{{ msg.invoice }} — PDF</a></p>{% elif msg.offer_id %}<p>Příloha: <a href="{% url 'offer_pdf' msg.offer_id %}">PDF cenové nabídky</a></p>{% endif %}<form method="post">{% csrf_token %}{{ form.as_p }}<div class="actions"><button name="intent" value="send">Odeslat e-mail</button><button class="quiet" name="intent" value="draft">Uložit na později</button></div></form></section>{% endblock %}
